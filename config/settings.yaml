# Job automation settings (CLI) - template.
# Copy to config/settings.local.yaml (gitignored) and put your real values there;
# the CLI uses settings.local.yaml automatically when it exists.
# Secrets (API keys, mailbox passwords) never go in this file -- put them in .env.
# Any relative path below is resolved against the project directory.

timezone: Asia/Kolkata

paths:
  # Root for reports, the SQLite database, logs, the import inbox and caches.
  data_root: ~/Job_Applications

candidate:
  name: Your Name
  # Can be overridden with the RESUME_PATH environment variable.
  resume_path: "/absolute/path/to/resume.pdf"
  location: Bengaluru, Karnataka, India
  # The resume summary says "6+ years". Matching always uses the experience
  # calculated from employment dates; this value is only used to flag discrepancies.
  stated_experience_years: 6
  education: Bachelor of Commerce
  primary_domains: [Finance, Healthcare Operations]
  # Verified answers for screening questions (CTC, notice period, ...).
  verified_facts_file: config/candidate_profile.json
  # Initial matching keywords. Each one is checked against the resume text;
  # anything not found in the resume is reported and NOT used for matching.
  seed_skills:
    - Financial Analysis
    - FP&A
    - Financial Modeling
    - Advanced Microsoft Excel
    - Accounts Receivable
    - Payment Posting
    - Financial Statement Analysis
    - Excel Reporting
    - PivotTables
    - Data Validation
    - Healthcare Operations
    - Process Improvement
    - Stakeholder Coordination
    - Exception Resolution

search:
  job_titles:
    - Financial Analyst
    - FP&A Analyst
    - Accounts Receivable Analyst
    - Finance Analyst
    - Financial Reporting Analyst
    - MIS Analyst
    - Financial Modeling Analyst
    - Revenue Analyst
    - Payment Posting Analyst
    - Finance Operations Analyst
  # "Remote - India" is treated as a remote search inside India.
  locations:
    - Bengaluru
    - Remote - India
  posted_within_hours: 24
  experience_min_years: 3
  experience_max_years: 8
  # Minimum annual salary in lakhs (LPA). null = no minimum.
  min_salary_lpa: null
  employment_types: [Full-time, Contract]
  work_modes: [Remote, Hybrid, On-site]

matching:
  # Jobs at or above this score (and eligible) are shortlisted.
  min_match_score: 70
  weights:
    core_skills: 35
    experience: 25
    responsibilities: 20
    education: 10
    location: 10
  categories:
    excellent: 85
    good: 70
    moderate: 55
  # A job without a description can be scored from its title, but it is not
  # shortlisted until you add the description (python main.py add-jd ...).
  require_description_for_shortlist: true

# Hard eligibility rules, evaluated separately from the match score.
eligibility:
  # Ineligible when the job's minimum experience exceeds the candidate's by more than this.
  max_experience_gap_years: 2.0
  allowed_work_modes: [Remote, Hybrid, On-site]
  allowed_employment_types: [Full-time, Contract]
  # On-site/hybrid jobs must be in one of these cities (remote jobs are always location-eligible).
  allowed_locations: [Bengaluru, Bangalore]
  # Only applied when the job states a salary.
  enforce_min_salary: false
  excluded_companies: []
  excluded_title_keywords: [Director, Vice President, VP, Head of, Chief, Intern, Internship]
  # Qualifications the candidate does not hold. A job is marked NEEDS_REVIEW when
  # its description says one of these is mandatory/required.
  qualifications_candidate_lacks: [CA, Chartered Accountant, CPA, CFA, ACCA, CMA, MBA]
  max_job_age_days: 30

applications:
  # DISCOVERY_ONLY | ASSISTED | APPROVAL_REQUIRED | PERMITTED_AUTO_APPLY
  mode: APPROVAL_REQUIRED
  max_per_day: 15
  # Re-score jobs that have already been fully processed. Never creates a second application.
  reprocess_seen_jobs: false
  # Skip a job when an application already exists for the same company + title on another platform.
  block_cross_platform_duplicates: true
  cover_letter:
    enabled: false
    generate_when_required: true
  open_browser_on_approve: true

platforms:
  linkedin:
    enabled: true
  indeed:
    enabled: true
    domain: in.indeed.com
  naukri:
    enabled: true

sources:
  # Drop job files (JSON / CSV / TXT) into <data_root>/inbox, or use `python main.py add-job`.
  import_inbox:
    enabled: true
  # Reads job-alert and application-confirmation emails from the candidate's own
  # mailbox over IMAP (read-only). Credentials: IMAP_USERNAME / IMAP_PASSWORD in .env.
  email_alerts:
    enabled: false
    imap_host: imap.gmail.com
    imap_port: 993
    folder: INBOX
    lookback_days: 2
    max_messages: 200

llm:
  # anthropic | openai_compatible | rule_based
  provider: anthropic
  model: claude-opus-5
  # Reasoning effort for Anthropic models: low | medium | high | xhigh | max
  effort: medium
  # Only for openai_compatible (e.g. http://localhost:11434/v1 for a local Ollama container).
  base_url: null
  # Name of the environment variable that holds the API key.
  api_key_env: ANTHROPIC_API_KEY
  timeout_seconds: 180
  max_concurrency: 3
  # If the LLM is unavailable, score with the transparent rule-based scorer instead
  # of failing. Every affected job is labelled with the scoring method used.
  fallback_to_rule_based: true

scheduler:
  run_time: "09:00"
  # Run the missed daily job on startup if the machine was off at run_time.
  run_missed_on_startup: true
  misfire_grace_hours: 6
  retry_attempts: 3
  retry_backoff_seconds: 120

logging:
  level: INFO
