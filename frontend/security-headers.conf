# Security headers for every response. Included at server level AND in each location that has its own add_header:
# nginx drops all inherited add_header lines in a block that defines any of its own.
# The full Content-Security-Policy is a <meta> tag in index.html (GitHub Pages can't send headers); this header adds
# only what a <meta> CSP can't express. Both policies apply, so a resource must pass both.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Browser features the app never uses. Clipboard stays allowed: the app copies codes and cover letters.
add_header Permissions-Policy "accelerometer=(), browsing-topics=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=()" always;
