server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;
    server_tokens off;

    # X-Frame-Options, CSP frame-ancestors, nosniff, Referrer-Policy, Permissions-Policy (copied in by the Dockerfile).
    # Repeated in every location below that sets its own add_header, or that location would send none of them.
    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # API on the same origin (LAN mode). The backend container stays private to the Docker network.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_connect_timeout 2s;  # fail fast when the backend container is stopped
    }

    location = /config.json { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-store"; try_files $uri =404; }
    location = /index.html { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "no-cache"; }
    location /assets/ { include /etc/nginx/snippets/security-headers.conf; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri /index.html; }
}
