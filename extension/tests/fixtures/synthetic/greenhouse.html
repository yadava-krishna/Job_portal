<!doctype html><html><body>
<!-- Synthetic form written for tests. Mirrors the structure of Greenhouse's hosted application form (ids, labels,
     react-select style comboboxes, EEO section). No content copied from any employer. -->
<h1 class="section-header">Accounts Receivable Analyst</h1>
<form id="application-form">
  <div><label id="first_name-label" for="first_name">First Name<span>*</span></label><input id="first_name" type="text" aria-required="true" autocomplete="given-name"></div>
  <div><label for="last_name">Last Name<span>*</span></label><input id="last_name" type="text" aria-required="true"></div>
  <div><label for="preferred_name">Preferred First Name</label><input id="preferred_name" type="text"></div>
  <div><label for="email">Email<span>*</span></label><input id="email" type="text" aria-required="true"></div>
  <div class="select"><label for="country">Country</label><div class="select__control"><input id="country" role="combobox" aria-controls="country-list" type="text"></div>
    <div id="country-list" role="listbox"><div role="option">India</div><div role="option">Indonesia</div></div></div>
  <div><label for="phone">Phone</label><input id="phone" type="tel"><input id="iti-0__search-input" type="search" style="display:none"></div>
  <div class="select"><label for="candidate-location">Location (City)</label><div class="select__control"><input id="candidate-location" role="combobox" aria-controls="loc-list" type="text"><span class="select__single-value"></span></div>
    <div id="loc-list" role="listbox"></div></div>
  <div class="file-upload"><label for="resume">Resume/CV</label><button type="button">Attach</button><input id="resume" type="file" accept=".pdf,.doc,.docx,.txt,.rtf"></div>
  <div class="select"><label for="school--0">School</label><div class="select__control"><input id="school--0" role="combobox" aria-controls="school-list" type="text"></div><div id="school-list" role="listbox"></div></div>
  <div class="select"><label for="degree--0">Degree</label><div class="select__control"><input id="degree--0" role="combobox" aria-controls="degree-list" type="text"></div>
    <div id="degree-list" role="listbox"><div role="option">Associate's Degree</div><div role="option">Bachelor's Degree</div><div role="option">Master's Degree</div></div></div>
  <div><label for="question_1001">LinkedIn Profile</label><input id="question_1001" type="text"></div>
  <div><label for="question_1002">What is your notice period?*</label><input id="question_1002" type="text" aria-required="true"></div>
  <div><label for="question_1003">Website</label><input id="question_1003" type="text" value="https://already.example"></div>
  <fieldset><legend>Which regions can you work in?</legend>
    <label><input type="checkbox" name="question_1004[]" value="1">India</label><label><input type="checkbox" name="question_1004[]" value="2">Singapore</label></fieldset>
  <div class="select"><label for="gender">Gender</label><div class="select__control"><input id="gender" role="combobox" type="text"></div></div>
  <div><label for="hidden_q">Hidden question</label><input id="hidden_q" type="text" style="display:none"></div>
  <div><label for="disabled_q">Disabled question</label><input id="disabled_q" type="text" disabled></div>
  <label><input type="checkbox" id="consent" name="consent">I agree to the privacy policy</label>
  <textarea name="g-recaptcha-response" style="display:none"></textarea>
  <button type="submit">Submit application</button>
</form></body></html>
